<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Travaux - Oullins-Pierre-Bénite</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Mapbox GL Draw CSS (compatible MapLibre) -->
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
    #container { display: flex; height: 100vh; width: 100vw; }

    /* Panneau latéral de saisie */
    #form-panel {
      width: 380px;
      background: #ffffff;
      border-right: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .header {
      padding: 16px;
      background: #0f172a;
      color: #ffffff;
    }
    .header h1 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; }

    .content { padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .step-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #1e40af;
      line-height: 1.4;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .row-dates { display: flex; gap: 10px; }
    .row-dates .form-group { flex: 1; }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-success { background: #16a34a; color: #ffffff; margin-top: auto; }
    .btn-success:hover { background: #15803d; }

    .status-msg {
      font-size: 0.8rem;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* Carte */
    #map { flex: 1; position: relative; }

    .map-controls-overlay {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 20;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Barre de recherche sur carte */
    .search-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      width: 300px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .search-box input { border: none; outline: none; width: 100%; margin-left: 8px; font-size: 0.85rem; }
    .search-results {
      background: #fff;
      border-radius: 6px;
      margin-top: 4px;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .search-item { padding: 8px; cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #f1f5f9; }
    .search-item:hover { background: #f8fafc; color: #2563eb; }
  </style>
</head>
<body>

<div id="container">
  <!-- Panneau latéral -->
  <div id="form-panel">
    <div class="header">
      <h1><i class="fa-solid fa-draw-polygon"></i> Saisie des Travaux</h1>
      <p>Éditeur d'emprises GeoJSON</p>
    </div>

    <div class="content">
      <div class="step-box">
        <strong>1. Dessinez sur la carte :</strong> Utilisez l'outil polygone <i class="fa-solid fa-draw-polygon"></i> en haut à droite de la carte pour tracer la zone de chantier (double-cliquez pour fermer la forme).<br>
        <strong>2. Remplissez</strong> la fiche ci-dessous.
      </div>

      <div id="draw-status" class="status-msg status-error" style="display: block;">
        <i class="fa-solid fa-circle-info"></i> Aucune forme sélectionnée sur la carte.
      </div>

      <div class="form-group">
        <label>Adresse / Localisation du chantier *</label>
        <input type="text" id="f-adresse" placeholder="Ex: Rue du Perron (entre n°30 et n°42)" required>
      </div>

      <div class="form-group">
        <label>Nature des travaux *</label>
        <select id="f-nature">
          <option value="Voirie / Chaussée">Voirie / Chaussée</option>
          <option value="Réseaux (Eau, Gaz, Électricité, Fibre)">Réseaux (Eau, Gaz, Électricité, Fibre)</option>
          <option value="Bâtiment / Échafaudage">Bâtiment / Échafaudage</option>
          <option value="Espaces verts / Élagage">Espaces verts / Élagage</option>
          <option value="Manifestation / Déménagement">Manifestation / Déménagement</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="row-dates">
        <div class="form-group">
          <label>Date de début *</label>
          <input type="date" id="f-debut" required>
        </div>
        <div class="form-group">
          <label>Date de fin *</label>
          <input type="date" id="f-fin" required>
        </div>
      </div>

      <div class="form-group">
        <label>Restrictions / Précisions</label>
        <textarea id="f-desc" rows="2" placeholder="Ex: Route barrée, stationnement interdit..."></textarea>
      </div>

      <div class="form-group">
        <label>Nom du fichier PDF (dans /arretes/) *</label>
        <input type="text" id="f-pdf" placeholder="Ex: arrete-2026-142.pdf" required>
      </div>

      <button id="btn-save-feature" class="btn btn-primary" disabled>
        <i class="fa-solid fa-check"></i> Enregistrer les attributs de cette zone
      </button>

      <div id="feedback-msg" class="status-msg"></div>

      <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 4px 0;">

      <button id="btn-download" class="btn btn-success">
        <i class="fa-solid fa-download"></i> Télécharger travaux.geojson (<span id="count-features">0</span>)
      </button>
    </div>
  </div>

  <!-- Carte -->
  <div id="map">
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color:#64748b;"></i>
        <input type="text" id="search-input" placeholder="Aller à une adresse..." autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <div class="map-controls-overlay">
      <input type="checkbox" id="toggle-ortho" style="cursor:pointer;">
      <label for="toggle-ortho" style="cursor:pointer; font-weight:500;">Afficher Orthophoto IGN (précision trottoirs)</label>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js"></script>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      'version': 8,
      'sources': {
        'osm': {
          'type': 'raster',
          'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          'tileSize': 256
        }
      },
      'layers': [{ 'id': 'osm-layer', 'type': 'raster', 'source': 'osm' }]
    },
    center: [4.8080, 45.7140],
    zoom: 15
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  // Initialisation de l'outil de dessin (Polygone, Ligne, Point, Corbeille)
  const draw = new MapboxDraw({
    displayControlsDefault: false,
    controls: {
      polygon: true,
      line_string: true,
      point: true,
      trash: true
    },
    defaultMode: 'draw_polygon'
  });
  map.addControl(draw, 'top-right');

  let selectedFeatureId = null;

  function updateCount() {
    const data = draw.getAll();
    document.getElementById('count-features').textContent = data.features.length;
  }

  // Chargement du fichier travaux.geojson existant s'il existe
  map.on('load', () => {
    // Source Orthophoto IGN
    map.addSource('src-ortho', {
      'type': 'raster',
      'tiles': ['https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}'],
      'tileSize': 256
    });
    map.addLayer({
      'id': 'layer-ortho',
      'type': 'raster',
      'source': 'src-ortho',
      'layout': { 'visibility': 'none' }
    }, 'osm-layer'); // Place sous les dessins
    map.moveLayer('layer-ortho'); // Juste au-dessus d'OSM

    // Charger les travaux existants dans l'éditeur
    fetch('./travaux.geojson')
      .then(res => res.ok ? res.json() : { type: 'FeatureCollection', features: [] })
      .then(data => {
        if (data && data.features) {
          draw.add(data);
          updateCount();
        }
      })
      .catch(() => console.log("Nouveau fichier travaux.geojson prêt."));
  });

  // Bascule Orthophoto
  document.getElementById('toggle-ortho').addEventListener('change', (e) => {
    map.setLayoutProperty('layer-ortho', 'visibility', e.target.checked ? 'visible' : 'none');
  });

  // Détection de la sélection ou création d'une forme
  function handleSelectionChange() {
    const selected = draw.getSelected();
    const statusBox = document.getElementById('draw-status');
    const btnSave = document.getElementById('btn-save-feature');

    if (selected.features.length > 0) {
      const feat = selected.features[0];
      selectedFeatureId = feat.id;
      const p = feat.properties || {};

      // Pré-remplir le formulaire si la forme a déjà des données
      document.getElementById('f-adresse').value = p.Adresse || '';
      document.getElementById('f-nature').value = p.Nature || 'Voirie / Chaussée';
      document.getElementById('f-debut').value = p.Date_debut || '';
      document.getElementById('f-fin').value = p.Date_fin || '';
      document.getElementById('f-desc').value = p.Description || '';
      document.getElementById('f-pdf').value = p.Lien_PDF ? p.Lien_PDF.replace('./arretes/', '') : '';

      statusBox.className = 'status-msg status-success';
      statusBox.innerHTML = `<i class="fa-solid fa-check-circle"></i> Zone sélectionnée (${feat.geometry.type}). Remplissez ou modifiez la fiche.`;
      btnSave.disabled = false;
    } else {
      selectedFeatureId = null;
      statusBox.className = 'status-msg status-error';
      statusBox.innerHTML = `<i class="fa-solid fa-circle-info"></i> Cliquez sur une forme existante ou dessinez-en une nouvelle.`;
      btnSave.disabled = true;
    }
    updateCount();
  }

  map.on('draw.create', handleSelectionChange);
  map.on('draw.selectionchange', handleSelectionChange);
  map.on('draw.delete', handleSelectionChange);

  // Enregistrer les propriétés sur la forme sélectionnée
  document.getElementById('btn-save-feature').addEventListener('click', () => {
    if (!selectedFeatureId) return;

    const adresse = document.getElementById('f-adresse').value.trim();
    const debut = document.getElementById('f-debut').value;
    const fin = document.getElementById('f-fin').value;
    const pdfName = document.getElementById('f-pdf').value.trim();

    if (!adresse || !debut || !fin || !pdfName) {
      alert("Veuillez remplir tous les champs obligatoires (*).");
      return;
    }

    draw.setFeatureProperty(selectedFeatureId, 'Adresse', adresse);
    draw.setFeatureProperty(selectedFeatureId, 'Nature', document.getElementById('f-nature').value);
    draw.setFeatureProperty(selectedFeatureId, 'Date_debut', debut);
    draw.setFeatureProperty(selectedFeatureId, 'Date_fin', fin);
    draw.setFeatureProperty(selectedFeatureId, 'Description', document.getElementById('f-desc').value.trim());
    draw.setFeatureProperty(selectedFeatureId, 'Lien_PDF', `./arretes/${pdfName}`);

    const fb = document.getElementById('feedback-msg');
    fb.className = 'status-msg status-success';
    fb.style.display = 'block';
    fb.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Fiche associée au polygone ! Cliquez sur le bouton vert en bas pour télécharger le fichier final.`;
    updateCount();
  });

  // Téléchargement du GeoJSON complet
  document.getElementById('btn-download').addEventListener('click', () => {
    const data = draw.getAll();
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'travaux.geojson';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Recherche d'adresse rapide
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.trim();
    if (q.length < 3) { searchResults.style.display = 'none'; return; }
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' Oullins-Pierre-Bénite')}&format=json&limit=5`)
      .then(r => r.json())
      .then(data => {
        searchResults.innerHTML = '';
        if (data.length > 0) {
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.textContent = item.display_name;
            div.onclick = () => {
              map.flyTo({ center: [parseFloat(item.lon), parseFloat(item.lat)], zoom: 18 });
              searchResults.style.display = 'none';
            };
            searchResults.appendChild(div);
          });
          searchResults.style.display = 'block';
        }
      });
  });
</script>
</body>
</html>
