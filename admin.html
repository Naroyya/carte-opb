<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Travaux - Oullins-Pierre-Bénite</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Mapbox GL Draw CSS via unpkg -->
  <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
    #container { display: flex; height: 100vh; width: 100vw; }

    /* Panneau latéral */
    #form-panel {
      width: 400px;
      background: #ffffff;
      border-right: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .header {
      padding: 16px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }

    .btn-config-toggle {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-config-toggle:hover { background: #334155; color: #fff; }

    /* Panneau de configuration GitHub */
    #github-config-box {
      background: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #github-config-box.open { display: flex; }
    .config-title { font-size: 0.78rem; font-weight: 700; color: #0f172a; text-transform: uppercase; }
    .config-row { display: flex; gap: 8px; }
    .config-row input, #gh-token {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.82rem;
    }

    .content { padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .step-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #1e40af;
      line-height: 1.4;
    }

    .archive-toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #334155;
    }

    .archive-toggle-box label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .archive-badge {
      background: #e2e8f0;
      color: #475569;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.78rem; font-weight: 600; color: #475569; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.86rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .row-dates { display: flex; gap: 10px; }
    .row-dates .form-group { flex: 1; }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-publish { background: #16a34a; color: #ffffff; font-size: 0.9rem; padding: 12px; }
    .btn-publish:hover { background: #15803d; }
    .btn-publish:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-secondary { background: #e2e8f0; color: #334155; font-size: 0.8rem; padding: 8px; }
    .btn-secondary:hover { background: #cbd5e1; }

    .status-msg {
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
      line-height: 1.35;
    }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-info { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    /* Carte */
    #map { flex: 1; position: relative; background: #e2e8f0; }

    .map-controls-overlay {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 20;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      width: 300px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .search-box input { border: none; outline: none; width: 100%; margin-left: 8px; font-size: 0.85rem; }
    .search-results {
      background: #fff;
      border-radius: 6px;
      margin-top: 4px;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .search-item { padding: 8px; cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #f1f5f9; }
    .search-item:hover { background: #f8fafc; color: #2563eb; }
  </style>
</head>
<body>

<div id="container">
  <div id="form-panel">
    <div class="header">
      <div>
        <h1><i class="fa-solid fa-draw-polygon"></i> Saisie des Travaux</h1>
        <p>Publication directe GitHub</p>
      </div>
      <button id="toggle-config" class="btn-config-toggle" title="Paramètres de connexion GitHub">
        <i class="fa-solid fa-gear"></i> GitHub
      </button>
    </div>

    <!-- Configuration GitHub -->
    <div id="github-config-box">
      <div class="config-title"><i class="fa-brands fa-github"></i> Connexion au dépôt</div>
      <div class="config-row">
        <input type="text" id="gh-owner" placeholder="Utilisateur / Orga">
        <input type="text" id="gh-repo" placeholder="Nom du dépôt">
      </div>
      <input type="password" id="gh-token" placeholder="Jeton GitHub (Fine-grained Token)">
      <button id="btn-save-config" class="btn btn-secondary">
        <i class="fa-solid fa-floppy-disk"></i> Mémoriser sur ce poste
      </button>
    </div>

    <div class="content">
      <div class="step-box">
        <strong>1.</strong> Tracez le polygone <i class="fa-solid fa-draw-polygon"></i> sur la carte (double-clic pour fermer).<br>
        <strong>2.</strong> Renseignez les champs, joignez le PDF et cliquez sur <strong>Publier</strong>.
      </div>

      <!-- Filtre d'affichage des travaux passés -->
      <div class="archive-toggle-box">
        <label>
          <input type="checkbox" id="toggle-show-archived" style="cursor:pointer;">
          <span>Afficher les travaux passés</span>
        </label>
        <span class="archive-badge" id="archived-count" title="Nombre de chantiers passés conservés en archive">0 archive</span>
      </div>

      <div id="draw-status" class="status-msg status-error" style="display: block;">
        <i class="fa-solid fa-circle-info"></i> Aucune forme sélectionnée sur la carte.
      </div>

      <div class="form-group">
        <label>Adresse / Localisation du chantier *</label>
        <input type="text" id="f-adresse" placeholder="Ex: Rue du Perron (entre n°30 et n°42)" required>
      </div>

      <div class="form-group">
        <label>Nature des travaux *</label>
        <select id="f-nature">
          <option value="Voirie / Chaussée">Voirie / Chaussée</option>
          <option value="Réseaux (Eau, Gaz, Électricité, Fibre)">Réseaux (Eau, Gaz, Électricité, Fibre)</option>
          <option value="Bâtiment / Échafaudage">Bâtiment / Échafaudage</option>
          <option value="Espaces verts / Élagage">Espaces verts / Élagage</option>
          <option value="Manifestation / Déménagement">Manifestation / Déménagement</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="row-dates">
        <div class="form-group">
          <label>Date de début *</label>
          <input type="date" id="f-debut" required>
        </div>
        <div class="form-group">
          <label>Date de fin *</label>
          <input type="date" id="f-fin" required>
        </div>
      </div>

      <div class="form-group">
        <label>Restrictions / Précisions</label>
        <textarea id="f-desc" rows="2" placeholder="Ex: Route barrée, stationnement interdit..."></textarea>
      </div>

      <div class="form-group">
        <label>Arrêté municipal (Fichier PDF) *</label>
        <input type="file" id="f-pdf-file" accept="application/pdf">
        <small id="current-pdf-label" style="font-size:0.75rem; color:#64748b;"></small>
      </div>

      <button id="btn-save-feature" class="btn btn-primary" disabled>
        <i class="fa-solid fa-check"></i> Valider la zone sur la carte
      </button>

      <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 2px 0;">

      <button id="btn-publish-github" class="btn btn-publish">
        <i class="fa-solid fa-cloud-arrow-up"></i> Publier en direct sur GitHub (<span id="count-features">0</span>)
      </button>

      <div id="publish-status" class="status-msg"></div>

      <button id="btn-download" class="btn btn-secondary">
        <i class="fa-solid fa-download"></i> Sauvegarde locale (travaux.geojson)
      </button>
    </div>
  </div>

  <!-- Carte -->
  <div id="map">
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color:#64748b;"></i>
        <input type="text" id="search-input" placeholder="Aller à une adresse..." autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <div class="map-controls-overlay">
      <input type="checkbox" id="toggle-ortho" style="cursor:pointer;">
      <label for="toggle-ortho" style="cursor:pointer; font-weight:500;">Afficher Orthophoto IGN</label>
    </div>
  </div>
</div>

<!-- Scripts via unpkg -->
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>

<script>
  // --- 1. Gestion de la configuration GitHub (localStorage) ---
  const configBox = document.getElementById('github-config-box');
  const ghOwnerInput = document.getElementById('gh-owner');
  const ghRepoInput = document.getElementById('gh-repo');
  const ghTokenInput = document.getElementById('gh-token');

  function detectRepoFromUrl() {
    const host = window.location.hostname;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const owner = host.replace('.github.io', '');
      const repo = pathParts.length > 0 ? pathParts[0] : '';
      return { owner, repo };
    }
    return { owner: '', repo: '' };
  }

  function loadConfig() {
    const detected = detectRepoFromUrl();
    ghOwnerInput.value = localStorage.getItem('gh_owner') || detected.owner;
    ghRepoInput.value = localStorage.getItem('gh_repo') || detected.repo;
    ghTokenInput.value = localStorage.getItem('gh_token') || '';

    if (!ghTokenInput.value) {
      configBox.classList.add('open');
    }
  }

  document.getElementById('toggle-config').addEventListener('click', () => {
    configBox.classList.toggle('open');
  });

  document.getElementById('btn-save-config').addEventListener('click', () => {
    localStorage.setItem('gh_owner', ghOwnerInput.value.trim());
    localStorage.setItem('gh_repo', ghRepoInput.value.trim());
    localStorage.setItem('gh_token', ghTokenInput.value.trim());
    configBox.classList.remove('open');
    showPublishStatus("Configuration GitHub mémorisée sur ce poste.", "success");
  });

  loadConfig();

  // --- 2. Initialisation de la carte & MapboxDraw compatible MapLibre ---
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      'version': 8,
      'sources': {
        'osm': {
          'type': 'raster',
          'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          'tileSize': 256
        }
      },
      'layers': [{ 'id': 'osm-layer', 'type': 'raster', 'source': 'osm' }]
    },
    center: [4.8080, 45.7140],
    zoom: 15
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  // Compatibilité MapLibre GL v3 pour MapboxDraw
  if (typeof MapboxDraw !== 'undefined' && MapboxDraw.constants && MapboxDraw.constants.classes) {
    MapboxDraw.constants.classes.CONTROL_BASE = '
