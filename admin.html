    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
    #container { display: flex; height: 100vh; width: 100vw; }

    #form-panel {
      width: 400px;

      padding: 16px;

      display: flex;

    }

    .btn-config-toggle {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-config-toggle:hover { background: #334155; color: #fff; }

      flex-direction: column;
