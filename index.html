<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail Cartographique - Oullins-Pierre-Bénite</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #334155;
    }

    #split-container {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      background-color: #f1f5f9;
    }

    .split {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Styling */
    #sidebar {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 18px 16px;
      background: #0f172a;
      color: #ffffff;
      border-bottom: 1px solid #1e293b;
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .sidebar-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: 16px;
    }

    .section-title:first-of-type {
      margin-top: 4px;
    }

    .layer-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .layer-item:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .layer-item.panoramax-item {
      background-color: #f0fdf4;
      border-color: #bbf7d0;
    }

    .layer-item.panoramax-item:hover {
      background-color: #dcfce7;
      border-color: #86efac;
    }

    .layer-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .layer-item.panoramax-item input[type="checkbox"] {
      accent-color: #16a34a;
    }

    .layer-label {
      margin-left: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
