<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail Cartographique - Oullins-Pierre-Bénite</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #334155;
    }

    #split-container {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      background-color: #f1f5f9;
    }

    .split {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Styling */
    #sidebar {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 18px 16px;
      background: #0f172a;
      color: #ffffff;
      border-bottom: 1px solid #1e293b;
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .sidebar-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: 4px;
    }

    .layer-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .layer-item:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .layer-item.panoramax-item {
      background-color: #f0fdf4;
      border-color: #bbf7d0;
    }

    .layer-item.panoramax-item:hover {
      background-color: #dcfce7;
      border-color: #86efac;
    }

    .layer-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .layer-item.panoramax-item input[type="checkbox"] {
      accent-color: #16a34a;
    }

    .layer-label {
      margin-left: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .layer-badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .badge-pmr { background-color: #2563eb; }
    .badge-livraison { background-color: #d97706; }
    .badge-panoramax { background-color: #10b981; }

    .instructions-card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: #1e40af;
      line-height: 1.45;
    }

    .instructions-card i {
      margin-right: 6px;
    }

    /* Map Panel */
    #map {
      background-color: #e2e8f0;
      position: relative;
    }

    /* Panoramax Panel */
    #panoramax-container {
      background-color: #0f172a;
      display: none;
      flex-direction: column;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      width: 34px;
      height: 34px;
      background-color: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .close-btn:hover {
      background-color: #dc2626;
      border-color: #dc2626;
      transform: scale(1.08);
    }

    #panoramax-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .panoramax-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      padding: 24px;
      text-align: center;
    }

    .panoramax-placeholder i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #10b981;
    }

    /* Splitters */
    .gutter {
      background-color: #cbd5e1;
      background-repeat: no-repeat;
      background-position: 50%;
      cursor: col-resize;
      transition: background-color 0.2s;
      z-index: 20;
    }

    .gutter:hover, .gutter:active {
      background-color: #2563eb;
    }

    .gutter.gutter-horizontal {
      width: 6px;
    }

    /* Popup Styling */
    .maplibregl-popup-content {
      padding: 14px 16px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      font-family: inherit;
    }

    .popup-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .popup-detail {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 2px;
    }
  </style>
</head>

    <!-- Left Sidebar -->

            <input type="range" id="ortho-opacity-slider" min="0" max="100" value="70" style="width: 100%; cursor: pointer; accent-color: #8b5cf6;">
          </div>
        </div>
